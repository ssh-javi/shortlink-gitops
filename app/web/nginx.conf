server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # SPA: serve index.html for unknown paths (except API / short links below)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy: /api/... -> shortlink-api:3000
    location /api/ {
        proxy_pass http://shortlink-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Short-link redirects: GET /<slug> -> API (avoids the SPA fallback)
    # The regex must be quoted: nginx treats unquoted { } as block delimiters.
    location ~ "^/[a-zA-Z0-9_-]{3,20}$" {
        proxy_pass http://shortlink-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
