# Application "observability": instala kube-prometheus-stack (Prometheus,
# Grafana, Alertmanager, exporters) desde el repo Helm oficial, pero con los
# valores personalizados que viven en GIT (multi-source + $values).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: shortlink
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 62.3.0
      helm:
        valueFiles:
          - $values/deploy/monitoring/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/ssh-javi/shortlink-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
