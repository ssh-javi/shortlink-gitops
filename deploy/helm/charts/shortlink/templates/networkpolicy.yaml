{{- if .Values.networkPolicy.enabled }}
# Zero-trust default-deny for the shortlink namespace, with minimal allow rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shortlink.fullname" . }}-default-deny
  labels:
    {{- include "shortlink.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shortlink.fullname" . }}-api
  labels:
    {{- include "shortlink.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shortlink.apiSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Web frontend -> API (HTTP)
    - from:
        - podSelector:
            matchLabels:
              {{- include "shortlink.webSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
    # Prometheus -> API (metrics)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.api.metricsPort }}
  egress:
    # API -> PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              {{- include "shortlink.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    # API -> Redis
    - to:
        - podSelector:
            matchLabels:
              {{- include "shortlink.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 6379
    # DNS (kube-dns) - required for service discovery
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shortlink.fullname" . }}-web
  labels:
    {{- include "shortlink.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shortlink.webSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # Ingress controller -> Web
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.web.targetPort }}
    # Direct access for demos / port-forwarding
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shortlink
{{- end }}
