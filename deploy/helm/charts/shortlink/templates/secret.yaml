apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shortlink.fullname" . }}-secret
  labels:
    {{- include "shortlink.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Connection strings with credentials. Demo-only values; see values.yaml.
  DATABASE_URL: postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ include "shortlink.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}
  REDIS_URL: redis://{{ include "shortlink.fullname" . }}-redis:6379
  POSTGRES_PASSWORD: {{ .Values.postgres.password }}
