apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "shortlink.fullname" . }}-test-connection"
  labels:
    {{- include "shortlink.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget", "--spider", "-q", "http://{{ include "shortlink.fullname" . }}-api:3000/health"]
  restartPolicy: Never
