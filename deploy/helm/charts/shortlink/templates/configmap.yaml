apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shortlink.fullname" . }}-config
  labels:
    {{- include "shortlink.labels" . | nindent 4 }}
data:
  # Non-sensitive configuration
  LOG_LEVEL: {{ .Values.api.env.LOG_LEVEL | quote }}
  SLUG_LENGTH: {{ .Values.api.env.SLUG_LENGTH | quote }}
  BASE_URL: {{ .Values.api.env.BASE_URL | quote }}
  # Chaos-engineering hook (0 = disabled). Set > 0 to simulate 5xx and demo
  # the canary rollback. Health/metrics endpoints are never affected.
  SIMULATE_ERROR_RATE: {{ .Values.api.env.SIMULATE_ERROR_RATE | default "0" | quote }}
