apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "shortlink.fullname" . }}-web
  labels:
    {{- include "shortlink.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "shortlink.webSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shortlink.webSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.webImage.repository }}:{{ .Values.webImage.tag }}"
          imagePullPolicy: {{ .Values.webImage.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.targetPort }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx-unprivileged needs writable cache + runtime dirs
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
  # Progressive delivery: canary with real traffic split (nginx ingress) and
  # automatic metric analysis. Steps come from values.yaml (web.canary.steps);
  # the metric gate is an INLINE (blocking) analysis at the 20% step, so the
  # rollout only shifts more traffic after the AnalysisTemplate gives a
  # Successful verdict - otherwise it aborts and rolls back automatically.
  # Note: stableService/canaryService live under strategy.canary (NOT inside
  # trafficRouting.nginx) per the Argo Rollouts API.
  strategy:
    canary:
      stableService: {{ include "shortlink.fullname" . }}-web
      canaryService: {{ include "shortlink.fullname" . }}-web-canary
      trafficRouting:
        nginx:
          stableIngress: {{ include "shortlink.fullname" . }}
      steps:
        {{- toYaml .Values.web.canary.steps | nindent 8 }}
