# AnalysisTemplate used by the web Rollout during canary steps.
# If the API error rate (last 2m) stays above 5% for `failureLimit`
# consecutive intervals, Argo Rollouts aborts the canary and rolls back
# to the stable version automatically.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "shortlink.fullname" . }}-error-rate
  labels:
    {{- include "shortlink.labels" . | nindent 4 }}
spec:
  metrics:
    - name: error-rate
      # Demo-tuned: 20s interval + failureLimit 2 -> a bad canary is rolled
      # back in ~40s. For production, consider longer windows (e.g. 60s
      # interval, failureLimit 3, [5m] range).
      interval: 20s
      # Error rate = 5xx requests / total requests. clamp_min avoids a
      # division by zero when there is no traffic. The trailing "or vector(0)"
      # makes the query return 0 when Prometheus has NO series for the window
      # (zero traffic) instead of an empty vector - an empty vector would make
      # Argo Rollouts fail with "slice index out of range" and abort the
      # rollout even though nothing is broken.
      successCondition: result[0] <= 0.05
      failureLimit: 2
      provider:
        prometheus:
          address: http://observability-kube-prometh-prometheus.monitoring:9090
          query: |
            sum(rate(http_requests_total{status=~"5.."}[1m]))
            /
            clamp_min(sum(rate(http_requests_total[1m])), 1)
            or vector(0)
