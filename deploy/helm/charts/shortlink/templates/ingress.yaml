{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "shortlink.fullname" . }}
  labels:
    {{- include "shortlink.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # All traffic lands on the web frontend, which proxies /api and /<slug>
          # to the API service internally.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "shortlink.fullname" . }}-web
                port:
                  number: {{ .Values.web.port }}
{{- end }}
